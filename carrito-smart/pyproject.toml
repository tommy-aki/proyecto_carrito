[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carrito-smart"
version = "0.1.0"
description = "Prototipo académico de carrito de compras inteligente"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "opencv-python>=4.10,<5",
    "ultralytics>=8.3,<9",
    "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
carrito-smart = "carrito_smart.app:main"

[tool.setuptools.packages.find]
include = ["carrito_smart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
